name: xchat

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_ADMIN_USER:?Set AUTH_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Set AUTH_ADMIN_PASSWORD}
    # The host port is 8180, because local tools often take 8080. The issuer
    # in a token contains this port, so IAM and each client use the same URL.
    ports:
      - "127.0.0.1:8180:8080"
    # A directory import requires the file name <realm>-realm.json. The realm
    # in auth-realm.json is iam-local.
    volumes:
      - ${AUTH_REALM_JSON:?Set AUTH_REALM_JSON to a auth-realm.json path}:/opt/keycloak/data/import/iam-local-realm.json:ro

  dbmigrator:
    profiles: [ "dbmigrate" ]
    build:
      context: .
      dockerfile: ./dbmigrator/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    container_name: chat-dbmigrator
    volumes:
      - ../services:/services:ro
    command: /bin/bash
    tty: true
    stdin_open: true

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: xchat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:9999:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 5s
      timeout: 3s
      retries: 20