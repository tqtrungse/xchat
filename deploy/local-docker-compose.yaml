name: xchat

services:
  dbmigrator:
    profiles: [ "dbmigrate" ]
    build:
      context: .
      dockerfile: ./dbmigrator/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    container_name: chat-dbmigrator
    volumes:
      - ../internal:/internal:ro
    command: /bin/bash
    tty: true
    stdin_open: true

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: xchat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:9996:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 5s
      timeout: 3s
      retries: 20